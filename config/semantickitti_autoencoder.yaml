# Config format schema number
format_version: 4

###################
## Model options
model_params:
  model_architecture: "cylinder_asym"

  output_shape:
    - 256
    - 256
    - 32

  fea_dim: 3
  out_fea_dim: 3 #128
  num_class: 2 #20
  num_input_features: 3 #32
  use_norm: True
  init_size: 8 #32
  in_channels: 8
  out_channels: 8
  autoencoder_num_res_blocks: 1
  autoencoder_channels_list:
    - 16
    - 32
    - 64
    - 128
  auto_groups: 4
  channels_list:
    - 32
    - 64
    - 128
  latent_channels: 64
  voxel_channel: 1

  num_res_blocks: 2
  n_heads: 2
  attention_resolutions:
    - 2
    - 4
    - 8
  dropout: 0
  n_layers: 1
  groups: 32
  dropout_rate: 0.2


###################
## Dataset options
dataset_params:
  dataset_type: "voxel_dataset"
  pc_dataset_type: "SemKITTI_sk_multiscan"
  ignore_label: 255
  return_test: True
  fixed_volume_space: True
  label_mapping: "/home/23368388/Software/AAAI_Code/3D_voxel_diffusion_plane/config/label_mapping/semantic-kitti-multiscan.yaml"

  max_volume_space:
    - 51.2
    - 25.6
    - 4.4
  min_volume_space:
    - 0
    - -25.6
    - -2


###################
## Data_loader options
train_data_loader:
  data_path: "/home/SSC_CODE/Data/VAE_Encoder_Features_One_To_One/" #Partial_one
  imageset:  "train"  #"train"
  return_ref: True
  batch_size: 4
  shuffle: True
  num_workers: 0

val_data_loader:
  data_path: "/home/SSC_CODE/Data/VAE_Encoder_Features_One_To_One/"
  imageset: "val"
#  imageset: "test"
  return_ref: True
  batch_size: 1 #2
  shuffle: False
  num_workers: 0


###################
## Train params
train_params:
  model_load_path: "/home/Software/AAAI_Code/3D_voxel_diffusion_plane/model_save_path/segmamba_no_FFM/"
  model_save_path: "/home/Software/AAAI_Code/3D_voxel_diffusion_plane/model_save_path/segmamba_no_FFM/" #diffusion_segmamba_29_VAE_one_to_one_bs4/
  checkpoint_every_n_steps: 4783
